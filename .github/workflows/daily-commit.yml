name: Daily Commit

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update activity log
        run: |
          mkdir -p .github/activity
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/activity/log.txt

      - name: Commit and push
        run: |
          git config user.name "MirianTs"
          git config user.email "tsartsidzemiriani59@gmail.com"
          git add .github/activity/log.txt
          git diff --cached --quiet || git commit -m "chore: daily activity update"
          git push
